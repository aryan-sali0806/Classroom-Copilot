[project]
name = "classroom-copilot"
version = "0.1.0"
description = "AI-powered Google Classroom assignment solver"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",

    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",

    # Settings & validation
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",

    # Google APIs
    "google-auth==2.37.0",
    "google-auth-oauthlib==1.2.1",
    "google-auth-httplib2==0.2.0",
    "google-api-python-client==2.157.0",

    # Gemini
    "google-generativeai==0.8.3",

    # Encryption
    "cryptography==44.0.0",

    # PDF generation
    "weasyprint==62.3",

    # Attachment text extraction
    "pymupdf==1.25.1",
    "python-docx==1.1.2",

    # Background scheduler
    "apscheduler==3.10.4",

    # Rate limiting
    "slowapi==0.1.9",

    # HTTP client
    "httpx==0.28.1",

    # PostgreSQL driver
    "psycopg2-binary==2.9.10",

    # Required by Starlette's SessionMiddleware for cookie signing
    "itsdangerous==2.2.0",

    # Environment variables
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "black==24.10.0",
    "isort==5.13.2",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
